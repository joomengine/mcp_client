name: Tested client release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override, without v; otherwise use release.json'
        required: false
        type: string
      component_ref:
        description: Optional installed component tag or commit override
        required: false
        type: string
      plugin_ref:
        description: Optional console plugin tag or commit override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      verify: ${{ steps.plan.outputs.verify }}
      version: ${{ steps.plan.outputs.version }}
      component_ref: ${{ steps.plan.outputs.component_ref }}
      plugin_ref: ${{ steps.plan.outputs.plugin_ref }}
      client_ref: ${{ steps.plan.outputs.client_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the declaration and release-state behavior without publishing
        run: |
          bash tools/release-plan.sh validate
          bash tests/release.sh
      - name: Plan the immutable release from the reviewed main commit
        id: plan
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMPONENT_REF: ${{ inputs.component_ref }}
          RELEASE_PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          set -euo pipefail
          bash tools/release-plan.sh plan | tee "$GITHUB_OUTPUT"
  tests:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  installed:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/installed.yml
    with:
      component_ref: ${{ needs.plan.outputs.component_ref }}
      plugin_ref: ${{ needs.plan.outputs.plugin_ref }}
    permissions:
      contents: read
  release:
    needs: [plan, tests, installed]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
      client_ref: ${{ steps.publish.outputs.client_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.client_ref }}
          persist-credentials: true
      - name: Publish or recover the tested version without moving an existing tag
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMPONENT_REF: ${{ needs.plan.outputs.component_ref }}
          RELEASE_PLUGIN_REF: ${{ needs.plan.outputs.plugin_ref }}
        run: |
          set -euo pipefail
          bash tools/release-plan.sh publish | tee "$GITHUB_OUTPUT"
  verify:
    needs: [plan, release]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.verify == 'true' && (needs.plan.outputs.publish == 'false' || needs.release.result == 'success')
    uses: ./.github/workflows/packagist.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      expected_reference: ${{ needs.plan.outputs.client_ref }}
      wait_for_index: true
    permissions:
      contents: read
