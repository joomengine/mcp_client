name: Tested client prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version without v, for example 0.1.0-alpha.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a reviewed main-branch prerelease
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc)\.(0|[1-9][0-9]*)$ ]]
  tests:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create immutable version tag and GitHub prerelease after tests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'This version tag already exists; it will not be overwritten.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --generate-notes --title "JoomEngine MCP Client $VERSION"
