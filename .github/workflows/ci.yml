name: PHP client contracts

on:
  pull_request:
  push:
    branches: [main, feature/standalone-php-client]
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, fileinfo, posix, pcntl
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: find src tests examples -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - run: php -l bin/joomengine-mcp
      - name: Standalone client behavioural contracts
        run: |
          set -euo pipefail
          mkdir -p build
          composer test | tee build/contracts.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-evidence-${{ matrix.php }}
          path: build/
          if-no-files-found: warn
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and exercise the Compose client over trusted HTTPS
        env:
          JOOMENGINE_MCP_PHP_VERSION: ${{ matrix.php }}
        run: |
          set -euo pipefail
          mkdir -p build
          bash tests/container.sh 2>&1 | tee build/container.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-evidence-${{ matrix.php }}
          path: build/container.log
          if-no-files-found: error
          retention-days: 7
